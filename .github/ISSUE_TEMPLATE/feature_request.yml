name: Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting! A short feature request is enough — we'll refine
        scope together in the thread.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What's missing or painful today? Avoid implementation details here.
      placeholder: "When I run a job with many targets I can't tell which URLs failed."
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed behavior
      description: A sketch of what the feature should do.
      placeholder: "Show per-URL success/failure in the job summary, with retry buttons."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Workarounds you use today, or other designs you thought of.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the system would this touch?
      multiple: true
      options:
        - Backend (API / scraper / jobs)
        - Frontend (UI / navigation / forms)
        - Auth / accounts / sessions
        - Database / migrations
        - Deployment / infra
        - Other
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked for an existing issue or PR covering this
          required: true