# Restrict collection to the real test suite.
#
# Without `testpaths`, a bare `pytest` at the repo root also walks `inspo/`
# and other stray directories, which breaks collection (e.g. the
# `inspo/MailAccess` subproject imports `backend` and explodes). CI and
# `make test` already pass `tests/` explicitly; this makes the bare invocation
# behave the same way.
[pytest]
testpaths = tests