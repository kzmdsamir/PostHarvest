# Shared proxy locations, included by both the :80 and :443 server blocks.

# ---- API (backend) ------------------------------------------------------
location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSocket support: the session-capture viewer bridges CDP over /api.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# Full path aliases that live under /api (health/docs) without a trailing
# slash — handled by the /api/ block above via the location match; keep
# /docs pointing to swagger only in non-prod.
location = /docs {
    proxy_pass http://backend:8000/docs;
}

# ---- Frontend (Next.js) -------------------------------------------------
location / {
    proxy_pass http://frontend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
}